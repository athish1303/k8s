apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-code
  namespace: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: application-code
  template:
    metadata:
      labels:
        app: application-code
    spec:
      containers:
        - name: application-code
          image: 129463260199.dkr.ecr.ap-south-1.amazonaws.com/application-code:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
